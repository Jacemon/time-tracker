<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <title>Time Tracker</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div id="auth-section" class="card hidden">
      <h1>Time Tracker</h1>
      <input type="text" id="username" placeholder="Логин" autocomplete="username">
      <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
      <div class="btn-group">
        <button id="login-btn" class="primary">Войти</button>
        <button id="register-btn" class="secondary">Регистрация</button>
      </div>
      <p id="auth-error" class="error"></p>
    </div>

    <div id="app-section" class="hidden">
      <header class="header">
        <span id="user-display"></span>
        <button id="logout-btn" class="small">Выйти</button>
      </header>

      <div class="card timer-card">
        <div id="status-badge" class="badge idle">Не активно</div>
        <div id="timer-display" class="timer">00:00:00</div>
        <div class="btn-group">
          <button id="work-btn" class="work">Работа</button>
          <button id="break-btn" class="break">Перерыв</button>
          <button id="stop-btn" class="stop">Стоп</button>
        </div>
      </div>

      <div class="summary-grid">
        <div class="card summary-card">
          <span class="summary-label">Работа сегодня</span>
          <strong id="today-work" class="summary-value work-text">00:00:00</strong>
        </div>
        <div class="card summary-card">
          <span class="summary-label">Перерывы сегодня</span>
          <strong id="today-break" class="summary-value break-text">00:00:00</strong>
        </div>
        <div class="card summary-card">
          <span class="summary-label">Всего сегодня</span>
          <strong id="today-total" class="summary-value total-text">00:00:00</strong>
        </div>
      </div>

      <button id="add-record-btn" class="secondary add-btn">
        <img src="/static/icons/plus.svg" class="icon" alt="">
        <span>Добавить запись</span>
      </button>

      <div id="history-container"></div>
    </div>
  </div>

  <div id="edit-modal" class="modal hidden">
    <div class="modal-content card">
      <h2 id="modal-title">Редактировать запись</h2>
      <label class="field-label">Тип</label>
      <select id="edit-type">
        <option value="WORK">Работа</option>
        <option value="BREAK">Перерыв</option>
      </select>
      <label class="field-label">Начало</label>
      <input type="datetime-local" id="edit-start" step="1">
      <label class="field-label">Конец</label>
      <input type="datetime-local" id="edit-end" step="1">
      <div class="btn-group">
        <button id="save-edit-btn" class="primary">Сохранить</button>
        <button id="cancel-edit-btn" class="secondary">Отмена</button>
      </div>
      <p id="edit-error" class="error"></p>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
